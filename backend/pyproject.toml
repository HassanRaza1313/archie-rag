[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragkit"
version = "0.1.0"
description = "Configurable agentic RAG framework: build chatbots over your own documents."
license = { text = "MIT" }
requires-python = ">=3.11"  # 3.10 reached end of life in October 2026
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "qdrant-client>=1.12",
  "pypdfium2>=4.30",
  "pdfplumber>=0.11",
  "python-multipart>=0.0.9",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
rerank = ["fastembed>=0.4"]
ocr = ["rapidocr-onnxruntime>=1.3"]  # also reads images
# Audio and video, transcribed on this machine (CTranslate2 Whisper; decodes video sound with PyAV).
audio = ["faster-whisper>=1.1"]
# Layout reader (Docling): page-layout and table-structure models, Office formats. Several hundred MB.
layout = ["docling>=2.14", "torch>=2.4", "torchvision>=0.19"]  # torch listed so the CPU index below applies
# Generates the ingestion benchmark corpus (bench/make_corpus.py).
bench = ["python-docx>=1.1", "python-pptx>=1.0", "openpyxl>=3.1", "pillow>=10.1"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[project.scripts]
ragkit = "ragkit.cli:main"

# CPU-only PyTorch for the layout extra; the default PyPI wheels pull in gigabytes of CUDA libraries.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ragkit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "N"]
ignore = ["S101", "S311", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "N802"]

[tool.mypy]
python_version = "3.11"
packages = ["ragkit"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
