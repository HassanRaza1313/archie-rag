# Prometheus for ragkit: `rag up --observability` (profile "observability"), UI on http://localhost:9090.
# When RAG_API_KEY is set, /metrics needs it too: put the key in a file and add
#   authorization: { credentials_file: /etc/prometheus/api-key }
# to the scrape job below.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: ragkit
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
